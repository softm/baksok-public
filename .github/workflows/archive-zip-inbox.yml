name: Archive ZIP inbox

on:
  push:
    paths:
      - 'zip/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-zip-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build HTML-first archive records
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, html, json, os, re, shutil, stat, tempfile, unicodedata, zipfile

          ROOT=Path.cwd(); INBOX=ROOT/'zip'; ARCHIVE=ROOT/'archive'
          IGNORE={'.DS_Store','Thumbs.db','__MACOSX','.gitkeep'}
          ARCHIVE.mkdir(exist_ok=True)

          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()

          def wanted(p,root):
              rel=p.relative_to(root)
              return p.is_file() and not any(x in IGNORE or x.startswith('._') for x in rel.parts)

          def files(root):
              return [p for p in sorted(root.rglob('*')) if wanted(p,root)]

          def tree_sha(root):
              h=hashlib.sha256()
              for p in files(root):
                  r=p.relative_to(root).as_posix()
                  h.update(r.encode()); h.update(b'\0'); h.update(sha(p).encode()); h.update(b'\n')
              return h.hexdigest()

          def safe_extract(z,d):
              total=0
              with zipfile.ZipFile(z) as q:
                  for m in q.infolist():
                      n=unicodedata.normalize('NFC',m.filename)
                      pp=PurePosixPath(n)
                      if m.is_dir() or any(x in IGNORE or x.startswith('._') for x in pp.parts): continue
                      if pp.is_absolute() or '..' in pp.parts or '\\' in n or '\x00' in n: raise ValueError('unsafe zip path')
                      if stat.S_ISLNK(m.external_attr>>16): raise ValueError('symlink refused')
                      total += m.file_size
                      if m.file_size >= 100*1024*1024 or total > 2*1024**3: raise ValueError('oversized zip')
                      out=d.joinpath(*pp.parts); out.parent.mkdir(parents=True,exist_ok=True)
                      with q.open(m) as a,out.open('wb') as b: shutil.copyfileobj(a,b)

          def unwrap(root):
              while True:
                  kids=[p for p in root.iterdir() if p.name not in IGNORE]
                  if len(kids)==1 and kids[0].is_dir(): root=kids[0]
                  else: return root

          def choose_html(root):
              hs=[p for p in files(root) if p.suffix.lower() in {'.html','.htm'}]
              if not hs: return None
              exact=[p for p in hs if p.name.lower()=='index.html']
              if exact:return exact[0]
              top=[p for p in hs if p.parent==root]
              return max(top or hs,key=lambda p:p.stat().st_size)

          def slug_for(name,fingerprint):
              m=re.match(r'^(20\d{6})[_ -]?(.*)$',name)
              date=m.group(1) if m else 'archive'
              tail=(m.group(2) if m else name).lower()
              tail=re.sub(r'\.(zip)$','',tail)
              tail=re.sub(r'[^a-z0-9]+','-',tail).strip('-')[:48]
              return f"{date}-{tail or fingerprint[:10]}"

          records=[]; skipped=[]
          inputs=[]
          if INBOX.exists():
              inputs += [p for p in sorted(INBOX.iterdir()) if p.name not in IGNORE and (p.is_dir() or p.suffix.lower()=='.zip')]
          for inp in inputs:
              with tempfile.TemporaryDirectory() as td:
                  stage=Path(td)/'src'; stage.mkdir()
                  if inp.is_dir():
                      shutil.copytree(inp,stage,dirs_exist_ok=True)
                      src=unwrap(stage); fp=tree_sha(src); kind='folder'
                  else:
                      safe_extract(inp,stage); src=unwrap(stage); fp=sha(inp); kind='zip'
                  entry=choose_html(src)
                  if not entry:
                      skipped.append({'input':inp.name,'reason':'HTML source missing; MD is not converted'})
                      continue
                  slug=slug_for(inp.stem if inp.is_file() else inp.name,fp)
                  dst=ARCHIVE/slug
                  manifest=dst/'archive-manifest.json'
                  if manifest.exists():
                      old=json.loads(manifest.read_text(encoding='utf-8'))
                      if old.get('inputSha256')==fp:
                          records.append(old); continue
                      skipped.append({'input':inp.name,'reason':'existing canonical slug has different source'})
                      continue
                  shutil.copytree(src,dst)
                  rel=entry.relative_to(src)
                  if rel.as_posix()!='index.html': shutil.copy2(dst/rel,dst/'index.html')
                  if sha(entry)!=sha(dst/'index.html'): raise SystemExit('HTML byte identity check failed')
                  mm={
                    'schemaVersion':1,'id':slug,'slug':slug,'input':inp.name,'inputKind':kind,
                    'inputSha256':fp,'entrySource':rel.as_posix(),'entrySha256':sha(entry),
                    'files':[{'path':p.relative_to(dst).as_posix(),'size':p.stat().st_size,'sha256':sha(p)} for p in files(dst)]
                  }
                  manifest.write_text(json.dumps(mm,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  records.append(mm)

          manifests=[]
          for p in sorted(ARCHIVE.glob('*/archive-manifest.json')):
              try: manifests.append(json.loads(p.read_text(encoding='utf-8')))
              except Exception: pass
          (ARCHIVE/'index.json').write_text(json.dumps({'records':manifests,'skipped':skipped},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          cards=''.join(f'<li><a href="{html.escape(x["slug"])}/">{html.escape(x["slug"])}</a></li>' for x in reversed(manifests))
          (ARCHIVE/'index.html').write_text('<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Archive</title><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.7}li{margin:10px 0}</style></head><body><h1>Archive</h1><ul>'+cards+'</ul></body></html>',encoding='utf-8')
          print(json.dumps({'processed':len(records),'skipped':skipped},ensure_ascii=False))
          PY
      - name: Commit archive output without deleting inbox
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- archive
          if ! git diff --cached --quiet; then
            git commit -m 'archive: process HTML-first zip inbox'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Retain inbox until deployment verification
        run: echo 'zip/ inputs are retained until live deployment, media, links and auth are verified.'
