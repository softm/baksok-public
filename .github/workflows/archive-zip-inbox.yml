name: Archive ZIP inbox

on:
  push:
    branches: [main]
    paths:
      - 'zip/**'
      - 'scripts/build_archive.py'
      - '.github/workflows/archive-zip-inbox.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-zip-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild public archive from zip folder
        run: python scripts/build_archive.py
      - name: Verify canonical HTML is byte-identical
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data=json.loads(Path('records/index.json').read_text())
          for record in data['records']:
              root=Path('records')/record['slug']
              digest=hashlib.sha256((root/'index.html').read_bytes()).hexdigest()
              if digest != record['entrySha256']:
                  raise SystemExit(f"entry mismatch: {record['slug']}")
          PY
      - name: Commit verified public archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html records
          if ! git diff --cached --quiet; then
            git commit -m 'archive: rebuild public records from zip folder'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Keep canonical source folder
        run: echo 'zip/ inputs remain the canonical deployment source.'
