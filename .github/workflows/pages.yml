name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYED_PAGE_URL.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/${{ github.repository }}/pages"             -f build_type=workflow || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployed URL
        run: |
          printf '%s\n' "${{ steps.deployment.outputs.page_url }}" > DEPLOYED_PAGE_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYED_PAGE_URL.txt
          git commit -m "Record deployed Pages URL [skip ci]" || exit 0
          git push
