name: Align archive list and detail titles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-record-titles.yml]
permissions:
  contents: write
  actions: write
  pages: write
jobs:
  titles:
    uses: softm/softm.github.io/.github/workflows/sync-record-titles-reusable.yml@f59f83eedafec1a5d8b31215b9b2f88885a2b811
    with:
      source_branch: main
      trigger_workflow: pages.yml
